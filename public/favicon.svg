  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#e5c17d" stroke-width="14" stroke-opacity="0.5"/>
  
  <!-- Elbrus Twin Peaks (Snow White & Cool Shadow) -->
